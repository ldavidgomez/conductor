# Claude Subscription Mode Example Workflow
#
# Prerequisites:
#   - Claude Code CLI installed and configured
#   - User logged in with "claude auth login"
#   - Running with explicit subscription auth_mode (not auto)
#
# This example demonstrates a basic workflow using Claude's subscription billing mode.
# It uses the bundled Claude CLI to authenticate and will display usage information
# with the label "API-equivalent estimate" (not a real invoice or quota measurement).
#
# See docs/providers/claude-subscription.md for the operator runbook.
#
# Run (makes one real inference on your subscription):
#   conductor run examples/claude-agent-sdk-subscription.yaml --input question="What is Conductor?"

workflow:
  name: subscription-example
  description: Simple Q&A workflow using Claude subscription billing
  version: "1.0.0"
  entry_point: answerer

  runtime:
    provider:
      name: claude-agent-sdk
      auth_mode: subscription
      native_tools: none
      setting_sources: []
    default_model: claude-haiku-4-5
    max_session_seconds: 60

  input:
    question:
      type: string
      required: true
      description: The question to answer
      default: "What is Conductor?"

agents:
  - name: answerer
    description: Answers questions using subscription billing
    prompt: |
      You are a helpful assistant. Please answer the following question clearly:

      {{ workflow.input.question }}

      Be concise and direct.
    tools: []
    output:
      answer:
        type: string
        description: The answer to the question
    routes:
      - to: $end

output:
  answer: "{{ answerer.output.answer }}"
